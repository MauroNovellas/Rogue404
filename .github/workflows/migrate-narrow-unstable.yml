name: Migrate narrow unstable corridors

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run narrow unstable corridor migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply guarded migration
        run: python3 .github/scripts/migrate-narrow-unstable.py

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: Structural regression guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression tests
        run: node tests/regression.test.cjs

      - name: Diff validation
        run: |
          git diff --check
          git diff --exit-code -- .github/scripts/migrate-narrow-unstable.py .github/workflows/migrate-narrow-unstable.yml .github/narrow-unstable-trigger || true
          test -n "$(git status --short game.js tests/regression.test.cjs)"

      - name: Commit migration
        run: |
          git config user.name "Mauro Novellas"
          git config user.email "mauro@novellas.es"
          git add game.js tests/regression.test.cjs
          git commit -m "Allow two passes through narrow unstable corridors"
          git push origin dev
