name: Consolidate runtime patch layers

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Merge polish layer into stability layer
        shell: bash
        run: |
          set -euo pipefail
          test -f stability.js
          test -f polish.js

          printf '\n\n' >> stability.js
          cat polish.js >> stability.js
          sed -i '\|<script src="/404/polish.js"></script>|d' index.html
          rm polish.js

          node --check stability.js
          git diff --check

      - name: Commit consolidated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stability.js index.html polish.js
          git commit -m "Consolidate runtime patch layers"
          git push origin HEAD:dev
