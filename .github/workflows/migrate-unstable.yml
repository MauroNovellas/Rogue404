name: Migrate Unstable floor

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Trigger Unstable robustness fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply Unstable robustness fix
        run: python3 .github/scripts/add_unstable.py

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: Structural guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression suite
        run: node tests/regression.test.cjs

      - name: Diff sanity
        run: git diff --check

      - name: Commit migrated game
        run: |
          git config user.name "Mauro Novellas"
          git config user.email "mauro@novellas.es"
          git add game.js tests/regression.test.cjs
          git commit -m "Harden Unstable fall protection"
          git push origin HEAD:dev
