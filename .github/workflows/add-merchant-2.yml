name: Add Merchant 2.0

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/add-merchant-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Merchant 2.0 migration
        run: python3 .github/scripts/add_merchant_2.py

      - name: JavaScript syntax
        run: node --check game.js

      - name: Structural regression guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression tests
        run: node tests/regression.test.cjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit Merchant 2.0
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js tests/regression.test.cjs
          git commit -m 'Add persistent merchant stock and selling'
          git push origin HEAD:dev
