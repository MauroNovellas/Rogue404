name: Refactor GameLogic into core

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Integrate validated GameLogic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/refactor_gamelogic.py
          node --check game.js
          git diff --check
          ! grep -q 'GameLogic.endTurn =' game.js
          ! grep -q 'GameLogic.processSurvival =' game.js
          ! grep -q 'const originalDie = GameLogic.die' game.js
          ! grep -q 'const originalInit = GameLogic.init' game.js
          ! grep -q 'const stabilizedWin = GameLogic.win' game.js

      - name: Commit GameLogic cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Integrate validated GameLogic fixes into core"
          git push origin HEAD:dev
