name: Refactor combat into core

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Integrate validated combat fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/refactor_combat.py
          node --check game.js
          git diff --check
          ! grep -q 'const originalEnemyAttack = CombatSystem.enemyAttack' game.js
          ! grep -q 'const stabilizedApplyDamage = CombatSystem.applyDamage' game.js
          ! grep -q 'const stabilizedUpdateEnemies = GameLogic.updateEnemies' game.js
          ! grep -q 'const stabilizedEnemyAttack = CombatSystem.enemyAttack' game.js
          ! grep -q 'const stabilizedAreaAttack = CombatSystem.performAreaAttack' game.js

      - name: Commit combat cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Integrate validated combat fixes into core"
          git push origin HEAD:dev
