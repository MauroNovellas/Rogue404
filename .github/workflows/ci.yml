name: Rogue404 checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Core regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: PHP syntax
        run: php -l rogue_api.php

      - name: Score JSON validity
        run: python3 -m json.tool rogue_scores.json >/dev/null

      - name: Structural regression guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression tests
        run: node tests/regression.test.cjs
