name: Add Frozen Depths

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build Frozen Depths
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/add_frozen_depths.py
          node --check game.js
          php -l rogue_api.php
          python3 -m json.tool rogue_scores.json >/dev/null
          node tests/structure.test.cjs
          node tests/regression.test.cjs
          git diff --check
          grep -q "const FloorSystem =" game.js
          grep -q "FROZEN_CRAMPONS" game.js
          grep -q 'id="floor-warning"' index.html
          grep -q 'FROZEN DEPTHS / PISOS ESPECIALES' style.css

      - name: Commit Frozen Depths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html style.css tests/regression.test.cjs
          git commit -m "Add Frozen Depths floor mechanics"
          git push origin HEAD:dev
