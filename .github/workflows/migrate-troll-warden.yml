name: Cleanup troll warden migration

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Cleanup troll warden migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove temporary migration files
        run: |
          git config user.name "Mauro Novellas"
          git config user.email "mauro@novellas.es"
          git rm .github/scripts/add_troll_warden.py
          git rm .github/troll-warden-trigger.txt
          git rm .github/workflows/migrate-troll-warden.yml
          git commit -m "Remove temporary troll warden migration files"
          git push origin HEAD:dev
