name: Add bat behavior

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Trigger bat behavior migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply bat behavior migration
        run: python3 .github/scripts/add_bat_behavior.py

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: Structural guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression suite
        run: node tests/regression.test.cjs

      - name: Diff sanity
        run: git diff --check

      - name: Commit bat behavior
        run: |
          git config user.name "Mauro Novellas"
          git config user.email "mauro@novellas.es"
          git add game.js style.css tests/regression.test.cjs
          git commit -m "Give bats a tactical dive attack"
          git push origin HEAD:dev
