name: Add Unstable Risk Zone

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run Unstable risk-reward migration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply migration
        run: python3 .github/scripts/add_unstable_risk_zone.py

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: Structural regression guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression tests
        run: node tests/regression.test.cjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js tests/regression.test.cjs
          git diff --cached --quiet && exit 1
          git commit -m 'Add Unstable risk-reward passage'
          git push origin dev
