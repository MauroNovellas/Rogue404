name: Add Magma Risk Zone

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/add-magma-risk-zone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Magma risk-reward migration
        run: python3 .github/scripts/add_magma_risk_zone.py

      - name: JavaScript syntax
        run: |
          node --check game.js
          node --check dev-tools.js

      - name: PHP syntax
        run: php -l rogue_api.php

      - name: Score JSON validity
        run: python3 -m json.tool rogue_scores.json >/dev/null

      - name: Structural regression guards
        run: node tests/structure.test.cjs

      - name: Gameplay regression tests
        run: node tests/regression.test.cjs

      - name: Diff hygiene
        run: git diff --check

      - name: Commit Magma risk-reward zone
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js tests/regression.test.cjs
          git commit -m 'Add Magma risk-reward chamber'
          git push origin HEAD:dev
